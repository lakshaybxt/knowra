spring:
  application:
    name: knowra

# Use H2 in-memory database for tests
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  ai:
    openai:
      api-key: test-key
      chat:
        model: gpt-3.5-turbo
        temperature: 0.2
      embedding:
        model: text-embedding-3-small

    vectorstore:
      pgvector:
        initialize-schema: false

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 50MB

knowra-config:
  rag:
    chunk-size: 700
    min-chunk-size-chars: 350
    min-chunk-length-to-embed: 5
    max-num-chunks: 10000
    chunk-overlap: 100
    top-k: 5
    similarity-threshold: 0.0

  cors:
    allowed-origins: "*"
    allowed-methods: GET, POST, PUT, DELETE, OPTIONS
    allowed-headers: "*"

logging:
  level:
    root: INFO

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true