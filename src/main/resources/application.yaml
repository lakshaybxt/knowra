spring:
  application:
    name: knowra

# Datasource Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:knowra}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    openai:
      base-url: https://openrouter.ai/api/v1
      api-key: ${OPENAI_API_KEY:demo-key}
      chat:
        model: ${OPENAI_CHAT_MODEL:gpt-3.5-turbo}
        temperature: ${OPENAI_CHAT_TEMPERATURE:0.2}

      embedding:
        model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

    vectorstore:
      pgvector:
        initialize-schema: false
        table-name: vector_store
        schema-name: public
        dimensions: 1536
        index-type: HNSW
        distance-type: COSINE_DISTANCE

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 50MB

  config:
    import:
      - classpath:env.properties

# APP Configuration
knowra-config:
  rag:
    chunk-size: 700
    min-chunk-size-chars: 350
    min-chunk-length-to-embed: 5
    max-num-chunks: 10000
    chunk-overlap: 100
    top-k: 5
    similarity-threshold: 0.0

  cors:
    allowed-origins: "*"
    allowed-methods: GET, POST, PUT, DELETE, OPTIONS
    allowed-headers: "*"

# Logging Configuration
logging:
  level:
    root: INFO

